<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Neon Glow Line Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Clef Gradient -->
    <linearGradient id="clefGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded App Icon Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="rgba(99,102,241,0.35)" stroke-width="6"/>

  <!-- Harmonic Scale Waves (Ascending Pentagram) -->
  <g opacity="0.8" filter="url(#glow)">
    <path d="M 60 360 Q 180 320 280 260 T 450 170" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 380 Q 180 340 280 280 T 450 190" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 400 Q 180 360 280 300 T 450 210" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 420 Q 180 380 280 320 T 450 230" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Ascending Scale Degree Equalizer Steps -->
  <g filter="url(#glow)">
    <rect x="310" y="220" width="16" height="40" rx="6" fill="#38bdf8" opacity="0.85"/>
    <rect x="340" y="195" width="16" height="65" rx="6" fill="#60a5fa" opacity="0.9"/>
    <rect x="370" y="165" width="16" height="95" rx="6" fill="#818cf8" opacity="0.95"/>
    <rect x="400" y="130" width="16" height="130" rx="6" fill="#a855f7"/>
    <rect x="430" y="95" width="16" height="165" rx="6" fill="#ec4899"/>
  </g>

  <!-- Glowing Modern Treble Clef (Clave de Sol Estilizada) -->
  <g filter="url(#glow)" transform="translate(200, 240) scale(0.72)">
    <!-- Main stem & loops -->
    <path d="M 12 18 C 12 -45 5 -120 0 -195 C -4 -250 -12 -280 12 -300 C 35 -318 55 -295 45 -260 C 32 -215 -18 -125 -18 -35 C -18 35 48 65 52 -5 C 55 -60 -5 -75 -25 -52 C -35 -40 -35 -15 -15 25 C 2 55 20 85 10 135 C 0 180 -55 160 -45 110 C -40 90 -20 85 -5 105" 
          fill="none" 
          stroke="url(#clefGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Clef Dot/Tail Accent -->
    <circle cx="-5" cy="115" r="16" fill="#ec4899"/>
  </g>
</svg>
